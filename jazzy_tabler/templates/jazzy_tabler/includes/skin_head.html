{# Skin stylesheet, after main.css and before custom_css. With the chooser on, the stored pick is applied before first paint. #}
{% if jazzy_ui.skin_chooser %}
    <link rel="stylesheet" id="jazzy-skin-css"{% if jazzy_ui.skin %} href="{{ jazzy_ui.skin_href }}"{% endif %}>
    {{ jazzy_ui.skin_stylesheets|json_script:"jazzy-skin-stylesheets" }}
    <script>
        (function () {
            var sheets = JSON.parse(document.getElementById('jazzy-skin-stylesheets').textContent);
            var link = document.getElementById('jazzy-skin-css');
            // An empty name is the stock theme; names missing from the map (a removed skin) are ignored.
            window.jazzyApplySkin = function (name) {
                if (name && !Object.prototype.hasOwnProperty.call(sheets, name)) return false;
                if (name) {
                    document.documentElement.setAttribute('data-jazzy-skin', name);
                    link.setAttribute('href', sheets[name]);
                } else {
                    document.documentElement.removeAttribute('data-jazzy-skin');
                    link.removeAttribute('href');
                }
                return true;
            };
            var stored = localStorage.getItem('jazzy-skin');
            if (stored !== null) window.jazzyApplySkin(stored);
        })();
    </script>
{% elif jazzy_ui.skin %}
    <link rel="stylesheet" id="jazzy-skin-css" href="{{ jazzy_ui.skin_href }}">
{% endif %}
