{% load i18n %}
<div class="nav-item dropdown d-none d-md-flex me-3" id="jazzy-skin-chooser">
    <a class="btn btn-ghost-secondary btn-icon" href="#" data-bs-toggle="dropdown" title="{% trans 'Skin' %}"
       aria-label="{% trans 'Skin' %}" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-palette"></i>
    </a>
    <div class="dropdown-menu dropdown-menu-end">
        <span class="dropdown-header">{% trans 'Skin' %}</span>
        <button type="button" class="dropdown-item" data-jazzy-skin-choice="">{% trans 'Stock' %}</button>
        {% for name in jazzy_ui.skin_stylesheets %}
            <button type="button" class="dropdown-item" data-jazzy-skin-choice="{{ name }}">{{ name }}</button>
        {% endfor %}
    </div>
</div>
