{% load i18n admin_urls jazzy_tabler %}
{% get_jazzy_ui_tweaks as jazzy_ui %}

{% block object-tools-items %}
    {% url opts|admin_urlname:'history' original.pk|admin_urlquote as history_url %}
    <a class="btn {{ jazzy_ui.button_classes.secondary }}" href="{% add_preserved_filters history_url %}">{% trans 'History' %}</a>
    {% if has_absolute_url %}
        <a href="{{ absolute_url }}" class="btn {{ jazzy_ui.button_classes.secondary }}">{% trans "View on site" %}</a>
    {% endif %}
{% endblock %}
