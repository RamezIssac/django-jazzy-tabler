{% load i18n static %}
<!DOCTYPE html>
{# Standalone error page: no sidebar/navbar chrome, only navigation back home. #}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans 'Page not found' %} (404)</title>
    <script>
        (function () {
            var mode = localStorage.getItem('jazzy-theme-mode') || 'light';
            if (mode === 'auto') {
                mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', mode);
        })();
    </script>
    <link rel="stylesheet" href="{% static "vendor/fontawesome-free/css/all.min.css" %}">
    <link rel="stylesheet" href="{% static "vendor/tabler/css/tabler.min.css" %}">
    <link rel="stylesheet" href="{% static "jazzy_tabler/css/main.css" %}">
</head>
<body class="antialiased">
    <div class="page page-center">
        <div class="container-tight py-4">
            <div class="empty">
                <div class="empty-header">404</div>
                <p class="empty-title">{% trans 'Page not found' %}</p>
                <p class="empty-subtitle text-secondary">
                    {% trans "The page you were looking for doesn't exist or has been moved." %}
                </p>
                <div class="empty-action d-flex gap-2 justify-content-center">
                    <button type="button" class="btn" onclick="history.back()">
                        <i class="fas fa-arrow-left me-2"></i>{% trans 'Go back' %}
                    </button>
                    <a href="{% url 'admin:index' %}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>{% trans 'Main page' %}
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
