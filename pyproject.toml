[project]
name = "django-jazzy-tabler"
version = "0.1.0"
description = "Drop-in Django admin theme built on Tabler.io, inspired by django-jazzmin"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ramez Ashraf" }]
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
]
keywords = ["django", "dashboard", "theme", "admin", "tabler"]
classifiers = [
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["jazzy_tabler"]

[tool.hatch.build.targets.wheel]
packages = ["jazzy_tabler"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
